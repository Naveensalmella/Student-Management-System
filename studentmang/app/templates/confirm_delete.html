{% extends "base.html" %}

{% block title %}Delete {{ student.name }}{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 text-center">
            <div class="card-body">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
                <h4 class="fw-bold mt-3">Delete Student</h4>
                <p class="text-muted">Are you sure you want to delete <strong>{{ student.name }}</strong>? This action cannot be undone.</p>

                {% if student.image %}
                <img src="{{ student.image.url }}" class="student-img-lg mb-3" alt="{{ student.name }}">
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Yes, Delete
                        </button>
                        <a href="{% url 'get_single_std' student.id %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
