

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Welcome to see all the users</h1>

    <table>
        <tr>
            <th>id</th>
            <th>name</th>
            <th>age</th>
            <th>email</th>
            <th>phone</th>
            <th>image</th>
        </tr>
        {% for std in get_data %}
        <tr>
            

            <td>{{ std.id }}</td>
            <td>{{ std.name }}</td>
            <td>{{ std.age }}</td>
            <td>{{ std.email }}</td>
            <td>{{ std.phone }}</td>
            <td><img src="{{ std.image.url }}"/></td>

            
        </tr>
        {% endfor %}
    </table>

</body>
</html>
